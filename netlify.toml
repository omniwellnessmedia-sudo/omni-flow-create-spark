[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.clarity.ms https://*.clarity.ms https://www.googletagmanager.com https://www.google-analytics.com https://connect.facebook.net https://cal.com https://www.paypal.com https://*.paypal.com https://app.cal.com https://analytics.tiktok.com https://snap.licdn.com; script-src-elem 'self' 'unsafe-inline' 'unsafe-eval' https://www.clarity.ms https://*.clarity.ms https://www.googletagmanager.com https://www.google-analytics.com https://connect.facebook.net https://cal.com https://www.paypal.com https://*.paypal.com https://app.cal.com https://googleads.g.doubleclick.net https://analytics.tiktok.com https://snap.licdn.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https: https://www.facebook.com https://px.ads.linkedin.com; connect-src 'self' https://dtjmhieeywdvhjxqyxad.supabase.co wss://dtjmhieeywdvhjxqyxad.supabase.co https://*.google-analytics.com https://analytics.google.com https://*.analytics.google.com https://stats.g.doubleclick.net https://www.googletagmanager.com https://www.clarity.ms https://*.clarity.ms https://www.facebook.com https://cal.com https://www.paypal.com https://*.paypal.com https://ingesteer.services-prod.nsvcs.net https://ad.doubleclick.net https://google.com https://www.google.com https://www.googleadservices.com https://analytics.tiktok.com https://px.ads.linkedin.com; frame-src https://cal.com https://app.cal.com https://www.google.com https://www.youtube.com https://www.paypal.com https://*.paypal.com https://drive.google.com;"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static image directories. These are pure asset paths with no SPA route behind
# them, so they are safe to cache hard.
[[headers]]
  for = "/branding/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/lovable-uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/events/wwpl/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# /events/* is NOT wildcarded: "/events/stunning-pigs" is a real SPA route that
# must keep serving fresh index.html. Only the image files are listed, by exact
# name, so a year-long cache can never strand the page itself.
# Content-hashed names would let us drop this list — until then, renaming a file
# is the way to bust its cache.
[[headers]]
  for = "/events/wwpl-square.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/events/wwpl-square.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/events/rda_square_1200x1200.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Canonical host: www resolves 301 to the apex the site (and all Ads final
# URLs) use — ad clicks must not land on a redirect chain or split hostname.
[[redirects]]
  from = "https://www.omniwellnessmedia.co.za/*"
  to = "https://omniwellnessmedia.co.za/:splat"
  status = 301
  force = true

# Real 301 for the duplicate event URL, so crawlers get a redirect rather than
# the client-side hop. MUST stay above the SPA fallback below — Netlify takes
# the first matching rule.
[[redirects]]
  from = "/community/events/stunning-pigs"
  to = "/events/stunning-pigs"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "18"