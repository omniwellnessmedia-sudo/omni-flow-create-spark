    <!-- Default canonical only. It must be the APEX host: netlify.toml 301s
         www -> apex, so a www canonical points at a URL that redirects.
         Per-page routes overwrite this via useSEO() (src/lib/seo.ts); any page
         that does not call useSEO inherits the homepage canonical, which is
         wrong for that page — wire useSEO rather than leaving it. -->

         stylesheet on load. The URL already carries display=swap, so text
         paints immediately in a fallback face and swaps when the webfont
         arrives — instead of the whole page waiting on a cross-origin CSS
         fetch. <noscript> keeps it working with JS disabled. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700;800;900&family=Oswald:wght@300;400;500&display=swap" onload="this.onload=null;this.rel='stylesheet'">

    <!-- ==================================================================
         SOCIAL ADVERTISING PIXELS — Meta, TikTok, LinkedIn
         ==================================================================
         Account-level loaders only. Per-event firing lives in
         src/lib/socialPixels.ts, which is also where the IDs are documented.
         Keep the IDs here in step with that file.

         EVERY loader is gated on a real ID. A placeholder means the network's
         script is never fetched at all — no DNS, no TLS, no JS parsed. This
         matters: the Meta loader previously ran unconditionally and pulled
         ~110KB of fbevents.js into the LCP window on every page while the
         placeholder meant it tracked precisely nothing.

         CSP: connect.facebook.net, analytics.tiktok.com and snap.licdn.com are
         allowlisted in BOTH netlify.toml and public/_headers. Netlify reads
         _headers first, so editing only the toml silently does nothing.
         ================================================================== -->

    <!-- Meta Pixel. Replace with the real numeric Pixel ID (15-16 digits). -->

      var OMNI_FB_PIXEL_ID = 'XXXXXXXXXXXXXXXX'; // see src/lib/socialPixels.ts
      if (/^[0-9]{6,}$/.test(OMNI_FB_PIXEL_ID)) {
        !function(f,b,e,v,n,t,s)
        {if(f.fbq)return;n=f.fbq=function(){n.callMethod?

        s.parentNode.insertBefore(t,s)}(window, document,'script',
        'https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', OMNI_FB_PIXEL_ID);
        fbq('track', 'PageView');
      }
    </script>
