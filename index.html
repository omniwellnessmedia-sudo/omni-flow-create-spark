    <!-- Google Analytics 4 - Omni Wellness Media -->

    <script>

      // Google Ads — Performance Max (Customer ID 396-986-7500).

      gtag('config', 'AW-11266714886');
      
      // ROAM Campaign Ecommerce Events Helper
      window.trackRoamEvent = function(eventName, params) {
        gtag('event', eventName, params);
        if (typeof fbq !== 'undefined') {
          const fbEventMap = {
            'view_item': 'ViewContent',
            'begin_checkout': 'InitiateCheckout',
            'purchase': 'Purchase',
            'add_to_cart': 'AddToCart',
            'lead': 'Lead'
          };
          if (fbEventMap[eventName]) {
            fbq('track', fbEventMap[eventName], params);
          }
        }
      };
    </script>
    
    <!-- Meta Pixel - Omni Wellness Media -->
    <script>
      // Only load and initialise the Meta Pixel once a REAL numeric Pixel ID is
      // set below. Replace XXXXXXXXXXXXXXXX with the real Pixel ID (digits).
      //
      // The loader is INSIDE the guard deliberately. Previously it ran
      // unconditionally, so every visit paid a DNS + TLS handshake to
      // connect.facebook.net and parsed ~110KB of fbevents.js on the main
      // thread — during the LCP window — while the placeholder id failed the
      // regex below, so fbq('init') never ran and nothing was ever tracked.
      var OMNI_FB_PIXEL_ID = 'XXXXXXXXXXXXXXXX';
      if (/^[0-9]{6,}$/.test(OMNI_FB_PIXEL_ID)) {
        !function(f,b,e,v,n,t,s)
        {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
        n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)}(window, document,'script',
        'https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', OMNI_FB_PIXEL_ID);
        fbq('track', 'PageView');
      }
    </script>
